<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 40" width="260" height="40">
  <defs>
    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="btnGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7B2FFF"/>
    </linearGradient>
    <linearGradient id="btnGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#6C35DE"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700&amp;display=swap');
    
    /* Default Dark Mode Styles */
    .btn-bg { fill: #0a0d14; stroke: url(#btnGradDark); stroke-width: 1.5; }
    .btn-text {
      font-family: 'Outfit', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #e2e8f0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .icon-cap { fill: none; stroke: #00D9FF; stroke-width: 1.5; }
    .icon-tassel { fill: none; stroke: #FF007F; stroke-width: 1; }
    .icon-base { fill: none; stroke: #7B2FFF; stroke-width: 1.5; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .anim-glow {
      animation: pulseGlow 2s ease-in-out infinite;
    }

    /* Light Mode Overrides */
    @media (prefers-color-scheme: light) {
      .btn-bg { fill: #f8fafc !important; stroke: url(#btnGradLight) !important; }
      .btn-text { fill: #1e293b !important; }
      .icon-cap { stroke: #00A3E0 !important; }
      .icon-tassel { stroke: #DB2777 !important; }
      .icon-base { stroke: #6C35DE !important; }
    }
  </style>

  <!-- Button Background -->
  <rect x="1" y="1" width="258" height="38" rx="8" class="btn-bg"/>

  <!-- Left Icon: Mortarboard -->
  <g transform="translate(16, 7)" class="anim-glow">
    <!-- Diamond Top -->
    <polygon points="15,4 25,8 15,12 5,8" class="icon-cap" filter="url(#glowCyan)"/>
    <!-- Cap Base -->
    <path d="M 9,10 L 9,15 Q 15,19 21,15 L 21,10" class="icon-base"/>
    <!-- Tassel -->
    <path d="M 15,8 L 7,11 L 6,17" class="icon-tassel"/>
    <circle cx="6" cy="17" r="1" fill="#FF007F"/>
  </g>

  <!-- Button Text -->
  <text x="50" y="24" class="btn-text">ACADEMIC CATALOG</text>
</svg>
