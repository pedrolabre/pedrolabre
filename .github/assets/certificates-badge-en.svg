<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 40" width="260" height="40">
  <defs>
    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <linearGradient id="btnGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7B2FFF"/>
    </linearGradient>
    <linearGradient id="btnGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="100%" stop-color="#6C35DE"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700&amp;display=swap');
    
    /* Default Dark Mode Styles */
    .btn-bg { fill: #0a0d14; stroke: url(#btnGradDark); stroke-width: 1.5; }
    .btn-text {
      font-family: 'Outfit', -apple-system, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #e2e8f0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .icon-seal { fill: none; stroke: #00D9FF; stroke-width: 1.5; }
    .icon-ribbon { fill: #FF007F; stroke: #FF007F; stroke-width: 1; }
    .icon-core { fill: none; stroke: #7B2FFF; stroke-width: 1.5; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .anim-glow {
      animation: pulseGlow 2s ease-in-out infinite;
    }

    /* Light Mode Overrides */
    @media (prefers-color-scheme: light) {
      .btn-bg { fill: #f8fafc !important; stroke: url(#btnGradLight) !important; }
      .btn-text { fill: #1e293b !important; }
      .icon-seal { stroke: #00A3E0 !important; }
      .icon-ribbon { fill: #DB2777 !important; stroke: #DB2777 !important; }
      .icon-core { stroke: #6C35DE !important; }
    }
  </style>

  <!-- Button Background -->
  <rect x="1" y="1" width="258" height="38" rx="8" class="btn-bg"/>

  <!-- Left Icon: Rosette Ribbon Seal -->
  <g transform="translate(16, 7)" class="anim-glow">
    <!-- Ribbon Tails -->
    <polygon points="12,14 10,21 14,19" class="icon-ribbon"/>
    <polygon points="18,14 20,21 16,19" class="icon-ribbon"/>
    <!-- Outer Seal Circle -->
    <circle cx="15" cy="11" r="6" class="icon-seal" filter="url(#glowCyan)"/>
    <!-- Inner Core Circle -->
    <circle cx="15" cy="11" r="3" class="icon-core"/>
  </g>

  <!-- Button Text -->
  <text x="50" y="24" class="btn-text">ACCESS FULL CATALOG</text>
</svg>
